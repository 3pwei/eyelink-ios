# Implemented / Unverified: generation and Apple SDK compilation require macOS.
# Swift 5 is a language mode, not a verified compiler version. See ADR-012.
name: EyeLink
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hant
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CODE_SIGNING_ALLOWED: "NO"
    GENERATE_INFOPLIST_FILE: "YES"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG"
      ENABLE_TESTABILITY: "YES"
      DEBUG_INFORMATION_FORMAT: dwarf
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      SWIFT_COMPILATION_MODE: wholemodule
      DEBUG_INFORMATION_FORMAT: "dwarf-with-dsym"
targets:
  EyeLink:
    type: application
    platform: iOS
    sources:
      - path: EyeLink
        excludes: [Resources]
      - path: EyeLink/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.3pwei.eyelink
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: EyeLink
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  EyeLinkTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: EyeLinkTests
    dependencies:
      - target: EyeLink
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.3pwei.eyelink.tests
  EyeLinkUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: EyeLinkUITests
    dependencies:
      - target: EyeLink
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.3pwei.eyelink.uitests
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  EyeLink:
    build:
      targets:
        EyeLink: all
        EyeLinkTests: [test]
        EyeLinkUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - EyeLinkTests
        - EyeLinkUITests
    archive:
      config: Release
